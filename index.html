<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <h1 id="store-name">Catálogo</h1>
      <input id="q" class="search" type="search" placeholder="Pesquisar por nome, código ou descrição" aria-label="Pesquisar produtos">
      <button id="open-cart" class="btn primary cart-btn" type="button">Meu pedido <span id="cart-count" class="badge">0</span></button>
    </div>
  </header>

  <main class="wrap">
    <p id="count" class="count"></p>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>Nenhum produto encontrado.</p>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Meu pedido">
    <header>
      <h2>Meu pedido</h2>
      <button id="close-cart" class="btn small" type="button">Fechar</button>
    </header>
    <div class="scroll">
      <div id="done" class="notice" hidden>Pedido enviado! Entraremos em contato em breve.</div>
      <div id="lines"></div>
      <p id="cart-empty" class="hint">Seu pedido está vazio. Use “Adicionar ao pedido” nos produtos.</p>

      <form id="order-form" hidden>
        <label class="field"><span>Seu nome</span><input id="c-name" required autocomplete="name"></label>
        <label class="field"><span>Telefone / WhatsApp</span><input id="c-phone" required inputmode="tel" autocomplete="tel"></label>
        <label class="field"><span>E-mail (opcional)</span><input id="c-email" type="email" autocomplete="email"></label>
        <label class="field"><span>Observações (opcional)</span><textarea id="c-notes"></textarea></label>
        <div id="form-error" class="notice err" hidden></div>
        <button id="send" class="btn primary" type="submit" style="width:100%">Enviar pedido</button>
      </form>
    </div>
  </aside>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script>
    const C = window.CONFIG;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    document.title = C.STORE_NAME;
    $('store-name').textContent = C.STORE_NAME;

    const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
    emailjs.init({ publicKey: C.EMAILJS_PUBLIC_KEY });

    let products = [];
    let cart = loadCart();

    function loadCart() { try { return JSON.parse(localStorage.getItem('cart') || '{}'); } catch { return {}; } }
    function saveCart() { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch {} }

    let toastTimer;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    const placeholder = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-5-5L5 21"/></svg>';

    async function loadProducts() {
      const { data, error } = await sb.from('products').select('*').order('name');
      if (error) throw error;
      products = data;
      // remove do pedido itens que foram apagados do catálogo
      for (const id of Object.keys(cart)) if (!products.find((p) => p.id === id)) delete cart[id];
      saveCart();
    }

    function renderGrid() {
      const q = $('q').value.trim().toLowerCase();
      const list = products.filter((p) => !q || `${p.name} ${p.code} ${p.description}`.toLowerCase().includes(q));
      $('count').textContent = `${list.length} ${list.length === 1 ? 'produto' : 'produtos'}`;
      $('empty').hidden = list.length > 0;
      $('grid').innerHTML = list.map((p) => {
        const out = p.stock <= 0;
        const inCart = cart[p.id] || 0;
        return `
        <article class="card" data-id="${esc(p.id)}">
          <div class="ph">${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">` : placeholder}</div>
          <div class="body">
            <h3>${esc(p.name)}</h3>
            <span class="code">Cód. ${esc(p.code)}</span>
            ${p.description ? `<div class="desc" title="Clique para ver tudo">${esc(p.description)}</div>` : ''}
            <span class="stock-tag ${out ? 'out' : 'ok'}">${out ? 'Esgotado' : `Em estoque: ${p.stock}`}</span>
            <button class="btn primary add" type="button" ${out ? 'disabled' : ''}>${inCart ? `Adicionar mais (${inCart} no pedido)` : 'Adicionar ao pedido'}</button>
          </div>
        </article>`;
      }).join('');
    }

    function addToCart(id) {
      const p = products.find((x) => x.id === id); if (!p) return;
      const cur = cart[id] || 0;
      if (cur >= p.stock) return toast('Quantidade máxima em estoque atingida');
      cart[id] = cur + 1; saveCart(); renderCart(); renderGrid();
      toast('Adicionado ao pedido');
    }

    function renderCart() {
      const items = Object.entries(cart).map(([id, qty]) => ({ p: products.find((x) => x.id === id), qty })).filter((i) => i.p);
      const total = items.reduce((s, i) => s + i.qty, 0);
      $('cart-count').textContent = total;
      $('cart-empty').hidden = items.length > 0;
      $('order-form').hidden = items.length === 0;
      $('lines').innerHTML = items.map(({ p, qty }) => `
        <div class="line-item" data-id="${esc(p.id)}">
          <div><div class="nm">${esc(p.name)}</div><div class="code">Cód. ${esc(p.code)}</div></div>
          <div class="qty">
            <button type="button" data-act="dec" aria-label="Diminuir">−</button>
            <span>${qty}</span>
            <button type="button" data-act="inc" aria-label="Aumentar">+</button>
          </div>
          <div></div>
          <button type="button" class="link" data-act="rm" style="justify-self:end">Remover</button>
        </div>`).join('');
    }

    function openCart() { $('drawer').hidden = false; $('overlay').hidden = false; }
    function closeCart() { $('drawer').hidden = true; $('overlay').hidden = true; $('done').hidden = true; }

    $('open-cart').onclick = openCart;
    $('close-cart').onclick = closeCart;
    $('overlay').onclick = closeCart;
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCart(); });
    $('q').addEventListener('input', renderGrid);

    $('grid').addEventListener('click', (e) => {
      const card = e.target.closest('.card'); if (!card) return;
      if (e.target.closest('.add')) addToCart(card.dataset.id);
      else if (e.target.closest('.desc')) e.target.closest('.desc').classList.toggle('open');
    });

    $('lines').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]'); if (!btn) return;
      const id = btn.closest('.line-item').dataset.id;
      const p = products.find((x) => x.id === id);
      if (btn.dataset.act === 'inc') { if ((cart[id] || 0) < p.stock) cart[id]++; else toast('Quantidade máxima em estoque atingida'); }
      if (btn.dataset.act === 'dec') { cart[id]--; if (cart[id] <= 0) delete cart[id]; }
      if (btn.dataset.act === 'rm') delete cart[id];
      saveCart(); renderCart(); renderGrid();
    });

    $('order-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = $('form-error'); err.hidden = true;
      const btn = $('send'); btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        await loadProducts(); // confere o estoque atual antes de enviar
        const items = Object.entries(cart).map(([id, qty]) => ({ p: products.find((x) => x.id === id), qty })).filter((i) => i.p);
        if (!items.length) throw new Error('Seu pedido está vazio.');
        const short = items.find((i) => i.qty > i.p.stock);
        if (short) {
          cart[short.p.id] = Math.max(short.p.stock, 0); if (!cart[short.p.id]) delete cart[short.p.id];
          saveCart(); renderCart(); renderGrid();
          throw new Error(`O estoque de “${short.p.name}” mudou. Ajustamos a quantidade; confira e envie de novo.`);
        }
        const lines = items.map((i) => `${i.qty}x  ${i.p.name}  (Cód. ${i.p.code})`).join('\n');
        await emailjs.send(C.EMAILJS_SERVICE_ID, C.EMAILJS_TEMPLATE_ID, {
          customer_name: $('c-name').value.trim(),
          customer_phone: $('c-phone').value.trim(),
          customer_email: $('c-email').value.trim() || 'não informado',
          notes: $('c-notes').value.trim() || '—',
          order_items: lines,
          total_units: items.reduce((s, i) => s + i.qty, 0)
        });
        cart = {}; saveCart(); renderCart(); renderGrid();
        $('order-form').reset();
        $('done').hidden = false;
      } catch (ex) {
        err.textContent = ex.message || 'Não foi possível enviar o pedido. Tente novamente.';
        err.hidden = false;
      } finally {
        btn.disabled = false; btn.textContent = 'Enviar pedido';
      }
    });

    (async () => {
      try {
        await loadProducts();
        renderGrid(); renderCart();
      } catch (ex) {
        $('grid').innerHTML = '';
        $('empty').hidden = false;
        $('empty').textContent = 'Não foi possível carregar o catálogo. Confira as chaves em config.js.';
        console.error(ex);
      }
    })();
  </script>
</body>
</html>
